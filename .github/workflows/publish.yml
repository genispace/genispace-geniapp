name: Publish GeniApp Package

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: stack/geniapp
    steps:
      - uses: actions/checkout@v6
        with:
          path: stack/geniapp
      - name: Checkout Workbench parity source
        uses: actions/checkout@v6
        with:
          repository: genispace/frontend
          ref: develop
          path: stack/frontend
          token: ${{ secrets.CICD_REPO_TOKEN }}

      - name: Resolve package contracts
        id: versions
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          SDK_VERSION=$(node -p "require('./package.json').peerDependencies['@genispace/sdk']")
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          if npm view "@genispace/geniapp@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "@genispace/geniapp@$PACKAGE_VERSION is already published"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sdk_version=$SDK_VERSION" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@latest
      - name: Verify pinned SDK is published
        run: npm view "@genispace/sdk@${{ steps.versions.outputs.sdk_version }}" version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:sdk-version
      - run: pnpm check:workbench-parity
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - name: Publish public package with provenance
        if: steps.versions.outputs.already_published != 'true'
        run: npm publish --access public
